---
services:
  trivy-operator-dashboard:
    container_name: trivy-operator-dashboard
    # Dockerfile: https://github.com/raoulx24/trivy-operator-dashboard/blob/master/build/dockerfile
    image: ghcr.io/raoulx24/trivy-operator-dashboard:latest
    user: 1000:0  # gid 0: your own group under rootless Docker, see bin/gen-configs
    env_file: [trivy-operator-dashboard.env]
    # environment: {}
    ports: [40090:8900]
    volumes: [../.kubeconfig.gen.yaml:/kubeconfig/config:ro]
    restart: no
