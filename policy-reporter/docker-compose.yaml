---
services:
  policy-reporter:
    container_name: policy-reporter
    # Dockerfile: https://github.com/kyverno/policy-reporter/blob/main/Dockerfile
    image: ghcr.io/kyverno/policy-reporter:latest
    user: 1000:0
    command: ["--port=8080", "--config=/app/config.yaml", "--dbfile=/sqlite/database.db", "--metrics-enabled=true", "--rest-enabled=true", "--profile=false", "--lease-name=policy-reporter", "--template-dir=/app/templates", "--kubeconfig=/kubeconfig"]
    env_file: [policy-reporter.env]
    # environment: {}
    # ports: []
    # extra_hosts: [host.docker.internal:host-gateway]  # if k8s API server is on the host
    volumes: [./.persist/config/core.yaml:/app/config.yaml:ro, ../.kubeconfig.gen.yaml:/kubeconfig:ro, ./.persist/sqlite:/sqlite]
    restart: unless-stopped

  policy-reporter-kyverno-plugin:
    container_name: policy-reporter-kyverno-plugin
    depends_on: [policy-reporter]
    image: ghcr.io/kyverno/policy-reporter/kyverno-plugin:0.7.3@sha256:777d2318ff194c666ce1cb1f881c0556d6dc2c1cda6b3990d5c1a42bdb64ae2e
    user: 1000:0
    command: ["run", "--config=/app/config.yaml", "--port=8080", "--local"]
    env_file: [policy-reporter.env]
    # environment: {}
    # ports: []
    volumes: [./.persist/config/kyverno-plugin.yaml:/app/config.yaml:ro, ../.kubeconfig.gen.yaml:/kubeconfig:ro]
    restart: unless-stopped

  policy-reporter-ui:
    container_name: policy-reporter-ui
    depends_on: [policy-reporter, policy-reporter-kyverno-plugin]
    image: ghcr.io/kyverno/policy-reporter-ui:2.9.1@sha256:642762427ef5bc941b22f51f6e7c5c8f116a0635132239d11fc89826edbd3eaf
    user: 1000:0
    command: ["run", "--config=/app/config.yaml", "--port=8080"]
    env_file: [policy-reporter.env]
    environment: [KUBECONFIG=/kubeconfig]
    ports: [40086:8080/tcp]
    volumes: [./.persist/config/ui.yaml:/app/config.yaml:ro, ../.kubeconfig.gen.yaml:/kubeconfig:ro]
    restart: unless-stopped
