---
services:
  pgadmin:
    container_name: pgadmin
    # Dockerfile: https://github.com/pgadmin-org/pgadmin4/blob/master/Dockerfile
    image: docker.io/dpage/pgadmin4:latest
    user: 5050:0
    env_file: [pgadmin.env, ./.persist/secrets.env]
    ports: [40084:80/tcp]
    volumes: [./.persist/servers.json:/pgadmin4/servers.json:ro, ./.persist/pgpass:/pgadmin4/pgpass:ro]
    restart: no
    extra_hosts: [host.docker.internal:host-gateway]  # postgres on the host machine, or through bin/forward
