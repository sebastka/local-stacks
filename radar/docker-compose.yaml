---
services:
  radar:
    container_name: radar
    # Dockerfile: https://github.com/skyhook-io/radar/blob/main/Dockerfile
    image: ghcr.io/skyhook-io/radar:latest
    user: 1000:1000
    # env_file: [.env]
    # environment: {}
    ports: [9280:9280/tcp]
    volumes: [./.kubeconfig.yaml:/.kube/config:ro, .persist:/.radar]
    restart: no
