---
services:
  velero-ui:
    container_name: velero-ui
    # Dockerfile: https://github.com/otwld/velero-ui/blob/main/Dockerfile
    image: docker.io/otwld/velero-ui:latest
    # user: 1000:1000
    # env_file: []
    environment: [KUBE_CONFIG_PATH=/app/.kube/config]
    ports: [40091:3000/tcp]
    volumes: [../.kubeconfig.gen.yaml:/app/.kube/config:ro]
    restart: no
